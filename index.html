<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Interactive Ultime - Sur-Mesure</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; min-height: 100vh; padding: 15px; display: flex; justify-content: center; align-items: center; }
    
    .app-container { width: 100%; max-width: 1100px; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); height: 92vh; }
    
    header { background: #1e293b; padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; color: #38bdf8; font-weight: 700; }
    .header-info { font-size: 0.85rem; color: #94a3b8; }

    .game-layout { display: grid; grid-template-columns: 1fr 320px; height: calc(92vh - 65px); overflow: hidden; }
    @media (max-width: 800px) { .game-layout { grid-template-columns: 1fr; overflow-y: auto; height: auto; } }

    .chat-section { display: flex; flex-direction: column; height: 100%; border-right: 1px solid #1e293b; background: #0b1120; }
    .log-panel { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    
    .msg { padding: 14px 18px; border-radius: 8px; font-size: 0.95rem; line-height: 1.6; max-width: 90%; }
    .msg.system { background: #1e293b; border-left: 3px solid #64748b; color: #cbd5e1; font-style: italic; width: 100%; max-width: 100%; font-size: 0.9rem; }
    .msg.user { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.ai { background: #1e293b; border: 1px solid #334155; color: #f8fafc; align-self: flex-start; border-left: 4px solid #38bdf8; border-bottom-left-radius: 2px; width: 100%; max-width: 100%; }

    .input-panel { padding: 15px 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    .input-panel textarea { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; font-size: 0.95rem; resize: none; height: 55px; font-family: inherit; }
    .input-panel textarea:focus { outline: none; border-color: #38bdf8; }
    .action-btn { background: #0284c7; color: white; border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .action-btn:hover:not(:disabled) { background: #0369a1; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .side-panel { background: #0f172a; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .panel-section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .panel-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 600; color: #f8fafc; }

    .reset-btn { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: 100%; transition: 0.2s; }
    .reset-btn:hover { background: #ef44441a; }

    .setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #090d16; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
    .setup-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.7); margin: auto; }
    .setup-card h2 { color: #38bdf8; font-size: 1.4rem; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; font-size: 0.95rem; font-family: inherit; }
    .form-group textarea { height: 80px; resize: none; }
    .error-msg { color: #ef4444; font-size: 0.85rem; display: none; }
    .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="setup-screen" id="setupScreen">
    <div class="setup-card">
      <h2>Simulation Sur-Mesure (Gemini 1.5 Flash)</h2>
      
      <div class="form-group">
        <label>Clé API Gemini :</label>
        <input type="password" id="cfgApiKey" placeholder="Collez votre clé API...">
        <span class="error-msg" id="apiKeyError">Veuillez entrer une clé API valide.</span>
      </div>

      <div class="form-group">
        <label>Mode de Simulation :</label>
        <select id="cfgMode">
          <option value="business">💼 Entrepreneuriat, Crypto & Business</option>
          <option value="combat">🏆 Carrière Sportive / Combat & Arts Martiaux</option>
          <option value="survie">🌲 Survie en Milieu Hostile & Post-Apocalypse</option>
          <option value="crime">🕶️ Monde Clandestin & Affaires Sombres</option>
        </select>
      </div>

      <div class="form-group">
        <label>Niveau de Difficulté :</label>
        <select id="cfgDiff">
          <option value="facile">Facile</option>
          <option value="normal" selected>Normal</option>
          <option value="difficile">Difficile (Pression maximale)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nom du Personnage :</label>
        <input type="text" id="cfgName" placeholder="Ex: Adam...">
      </div>

      <div class="form-group">
        <label>Votre Lore / Scénario de départ personnalisé :</label>
        <textarea id="cfgLore" placeholder="Ex: Je suis un jeune faucheur ruiné qui veut se lancer dans la crypto, ou je suis sur une île déserte infestée de zombies..."></textarea>
      </div>

      <button class="action-btn" id="launchBtn" style="padding: 14px;" onclick="initSimulation()">Générer l'Introduction Sur-Mesure</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <h1 id="appTitle">Simulation Interactive</h1>
      <div class="header-info" id="headerInfo">Tour 1</div>
    </header>

    <div class="game-layout">
      <div class="chat-section">
        <div class="log-panel" id="logPanel"></div>
        <div class="input-panel">
          <textarea id="userInput" placeholder="Tapez votre action en toute liberté..." onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitAction(); }"></textarea>
          <button class="action-btn" id="submitBtn" onclick="submitAction()">Envoyer</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="panel-section">
          <div class="panel-title">Profil</div>
          <div class="stat-row"><span class="stat-label">Nom</span><span class="stat-val" id="uiName">-</span></div>
          <div class="stat-row"><span class="stat-label">Mode</span><span class="stat-val" id="uiMode">-</span></div>
          <div class="stat-row"><span class="stat-label">Difficulté</span><span class="stat-val" id="uiDiff">-</span></div>
        </div>

        <div class="panel-section">
          <div class="panel-title">Statistiques & Jauges</div>
          <div id="statsContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <button class="reset-btn" onclick="resetToSetup()">Recommencer à zéro</button>
      </div>
    </div>
  </div>

  <script>
    let gameState = {
      apiKey: '',
      mode: '',
      difficulty: 'normal',
      name: '',
      lore: '',
      turn: 1,
      stats: {},
      history: []
    };

    const modeConfigs = {
      business: { name: "Business", stats: { argent: 3000, energie: 85, reputation: 10, stress: 20 }, labels: { argent: "Trésorerie (€)", energie: "Énergie", reputation: "Réputation", stress: "Stress" } },
      combat: { name: "Combat", stats: { forme: 80, technique: 40, argent: 500, moral: 75 }, labels: { forme: "Forme physique", technique: "Technique", argent: "Argent (€)", moral: "Moral" } },
      survie: { name: "Survie", stats: { sante: 100, faim: 80, ressources: 30, moral: 70 }, labels: { sante: "Santé (PV)", faim: "Ravitaillement", ressources: "Ressources", moral: "Moral" } },
      crime: { name: "Clandestin", stats: { cash: 2000, parano: 15, respect: 30, integrité: 100 }, labels: { cash: "Cash propre", parano: "Paranoïa", respect: "Respect", integrité: "Intégrité" } }
    };

    async function initSimulation() {
      let apiKey = document.getElementById('cfgApiKey').value.trim();
      if (!apiKey) {
        document.getElementById('apiKeyError').style.display = 'block';
        return;
      }

      let mode = document.getElementById('cfgMode').value;
      let diff = document.getElementById('cfgDiff').value;
      let name = document.getElementById('cfgName').value.trim() || "Adam";
      let lore = document.getElementById('cfgLore').value.trim() || "Je débute sans rien avec une ambition féroce.";

      gameState.apiKey = apiKey;
      gameState.mode = mode;
      gameState.difficulty = diff;
      gameState.name = name;
      gameState.lore = lore;
      gameState.turn = 1;
      gameState.stats = { ...modeConfigs[mode].stats };
      gameState.history = [];

      let launchBtn = document.getElementById('launchBtn');
      launchBtn.disabled = true;
      launchBtn.innerHTML = `<span class="loading-spinner"></span>Génération de l'univers par l'IA...`;

      // Appel initial pour que Gemini crée l'introduction entièrement personnalisée en fonction du lore
      let promptIntro = `Tu es le maître d'un jeu de rôle textuel de simulation hautement immersif. 
Le joueur s'appelle ${name}, en mode ${mode}, difficulté ${diff}. 
Son histoire/lore de départ personnalisé saisi par ses soins est : "${lore}".
Ses statistiques initiales sont : ${JSON.stringify(gameState.stats)}.

Rédige l'introduction unique et sur-mesure (Chapitre 1) en intégrant à 100% les spécificités de son lore (ex: s'il y a des zombies, des cryptos, une enfance difficile, etc.). Adapte totalement le ton à sa situation.
Réponds STRICTEMENT en JSON valide avec cette structure exacte :
{
  "narrative": "Le texte d'introduction immersif qui plante le décor en prenant en compte son lore précis...",
  "statChanges": {}
}`;

      try {
        let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptIntro }] }] })
        });

        let data = await response.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        let result = JSON.parse(rawText);

        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('uiName').innerText = name;
        document.getElementById('uiMode').innerText = modeConfigs[mode].name;
        document.getElementById('uiDiff').innerText = diff.toUpperCase();
        document.getElementById('appTitle').innerText = `Simulation : ${modeConfigs[mode].name}`;

        renderStats();

        let log = document.getElementById('logPanel');
        log.innerHTML = `
          <div class="msg system">Simulation initialisée pour <b>${name}</b> | Mode : ${modeConfigs[mode].name} (${diff.toUpperCase()})</div>
          <div class="msg ai"><b>Chapitre 1 : Le Commencement</b><br><br>${result.narrative}</div>
        `;
        
        gameState.history.push({ role: "model", parts: [{ text: result.narrative }] });

      } catch (err) {
        alert("Erreur lors de l'initialisation avec Gemini : " + err.message);
      }

      launchBtn.disabled = false;
      launchBtn.innerHTML = "Générer l'Introduction Sur-Mesure";
    }

    function renderStats() {
      let config = modeConfigs[gameState.mode];
      let container = document.getElementById('statsContainer');
      container.innerHTML = '';
      for (let key in gameState.stats) {
        container.innerHTML += `
          <div class="stat-row">
            <span class="stat-label">${config.labels[key] || key}</span>
            <span class="stat-val" id="stat-${key}">${gameState.stats[key]}</span>
          </div>
        `;
      }
      document.getElementById('headerInfo').innerText = `Tour ${gameState.turn}`;
    }

    async function submitAction() {
      let textarea = document.getElementById('userInput');
      let actionText = textarea.value.trim();
      if (!actionText) return;

      textarea.value = '';
      let log = document.getElementById('logPanel');
      log.innerHTML += `<div class="msg user">${actionText}</div>`;
      log.scrollTop = log.scrollHeight;

      document.getElementById('submitBtn').disabled = true;
      textarea.disabled = true;

      // Construction d'un prompt ultra-précis qui maintient le fil narratif de l'IA
      let systemPrompt = `Tu es le moteur expert d'un jeu de rôle textuel de simulation réaliste et adaptatif (${gameState.mode}). 
Le joueur s'appelle ${gameState.name}, difficulté: "${gameState.difficulty}", lore initial: "${gameState.lore}". 
Statistiques actuelles : ${JSON.stringify(gameState.stats)}.

Règles absolues :
1. Analyse l'action libre du joueur (${actionText}) en tenant compte de tout le contexte précédent et de son lore. L'IA doit réagir de manière cohérente, intelligente et organique (pas de réponses génériques).
2. Ajuste ses statistiques logiquement (augmentation ou diminution raisonnable entre 0 et des valeurs cohérentes, évitant les empilements absurdes).
3. Réponds STRICTEMENT sous format JSON valide (sans aucun texte parasite autour) avec la structure exacte :
{
  "narrative": "Le texte narratif de l'histoire qui fait progresser l'intrigue suite à l'action...",
  "statChanges": {
    "nom_de_stat": valeur_ajoutee_ou_soustraite (ex: -5 ou +10)
  }
}`;

      try {
        let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gameState.apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              { role: "user", parts: [{ text: systemPrompt }] },
              { role: "model", parts: [{ text: "Compris. J'attends l'action du joueur pour générer le JSON." }] },
              { role: "user", parts: [{ text: `Action du joueur : ${actionText}` }] }
            ]
          })
        });

        let data = await response.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        let result = JSON.parse(rawText);

        if (result.statChanges) {
          for (let s in result.statChanges) {
            if (gameState.stats[s] !== undefined) {
              gameState.stats[s] = Math.max(0, gameState.stats[s] + result.statChanges[s]);
            }
          }
        }

        gameState.turn++;
        renderStats();

        log.innerHTML += `<div class="msg ai"><b>Tour ${gameState.turn}</b><br><br>${result.narrative}</div>`;
        log.scrollTop = log.scrollHeight;

      } catch (err) {
        log.innerHTML += `<div class="msg system" style="color: #ef4444;">Erreur Gemini : ${err.message}. Vérifie ta console ou ta clé.</div>`;
      }

      document.getElementById('submitBtn').disabled = false;
      textarea.disabled = false;
      textarea.focus();
    }

    function resetToSetup() {
      document.getElementById('setupScreen').style.display = 'flex';
      document.getElementById('logPanel').innerHTML = '';
    }
  </script>
</body>
</html>
