<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Interactive AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #0f3460;
            background: #e94560;
            padding: 10px;
            border-radius: 8px;
            margin-top: 0;
        }
        #chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #0f3460;
            padding: 15px;
            border-radius: 8px;
            background: #0f3460;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
        }
        .user-msg {
            background-color: #e94560;
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background-color: #1a1a2e;
            color: #e0e0e0;
            align-self: flex-start;
            border: 1px solid #e94560;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #1a1a2e;
            color: white;
        }
        button {
            padding: 12px 20px;
            background-color: #e94560;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ff6b81;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulation Interactive</h1>
    <div id="chat-box">
        <div class="message ai-msg">Bienvenue ! Choisis ton thème, ton personnage ou ton monde pour lancer la simulation.</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Écris ton choix ou ton action ici..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script>
    // Remplace uniquement le texte entre guillemets ci-dessous par ta clé Groq
    const GROQ_API_KEY = "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";

    let conversationHistory = [
        {
            role: "system",
            content: "Tu es le maître du jeu d'une simulation interactive captivante. Propose des choix et des histoires immersives."
        }
    ];

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatBox = document.getElementById("chat-box");
        const userText = inputField.value.trim();

        if (!userText) return;

        // Afficher le message de l'utilisateur
        appendMessage(userText, "user-msg");
        inputField.value = "";
        
        // Bloquer la saisie pendant la réponse
        inputField.disabled = true;
        sendBtn.disabled = true;

        conversationHistory.push({ role: "user", content: userText });

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: conversationHistory
                })
            });

            const data = await response.json();

            if (data.choices && data.choices.length > 0) {
                const aiReply = data.choices[0].message.content;
                appendMessage(aiReply, "ai-msg");
                conversationHistory.push({ role: "assistant", content: aiReply });
            } else {
                appendMessage("Erreur de réponse de l'IA. Vérifie ta clé API.", "ai-msg");
            }
        } catch (error) {
            appendMessage("Erreur de connexion avec l'IA.", "ai-msg");
            console.error(error);
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chat-box");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${className}`;
        messageDiv.textContent = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
