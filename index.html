<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Carrière Sport de Combat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; padding: 15px; }
    
    .app-container { width: 100%; max-width: 1100px; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); height: 92vh; }
    
    header { background: #1e293b; padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    header h1 { font-size: 1.25rem; color: #38bdf8; font-weight: 700; }
    .header-info { font-size: 0.85rem; color: #94a3b8; }

    .game-layout { display: grid; grid-template-columns: 1fr 320px; height: calc(92vh - 65px); overflow: hidden; }
    @media (max-width: 800px) { .game-layout { grid-template-columns: 1fr; overflow-y: auto; height: auto; } }

    .chat-section { display: flex; flex-direction: column; height: 100%; min-height: 0; border-right: 1px solid #1e293b; background: #0b1120; }
    
    /* Correction clé du scroll : min-height: 0 permet au bloc de rétrécir et de scroller au lieu de déborder */
    .log-panel { flex: 1; min-height: 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    
    .msg { padding: 14px 18px; border-radius: 8px; font-size: 0.95rem; line-height: 1.6; max-width: 90%; flex-shrink: 0; }
    .msg.system { background: #1e293b; border-left: 3px solid #64748b; color: #cbd5e1; font-style: italic; width: 100%; max-width: 100%; font-size: 0.9rem; }
    .msg.user { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.ai { background: #1e293b; border: 1px solid #334155; color: #f8fafc; align-self: flex-start; border-left: 4px solid #38bdf8; border-bottom-left-radius: 2px; width: 100%; max-width: 100%; }

    .dilemma-box { margin-top: 12px; padding: 12px; background: #090d16; border: 1px dashed #38bdf8; border-radius: 6px; color: #38bdf8; font-weight: 500; }

    .input-panel { padding: 15px 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; flex-shrink: 0; }
    .input-panel textarea { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; font-size: 0.95rem; resize: none; height: 55px; font-family: inherit; }
    .input-panel textarea:focus { outline: none; border-color: #38bdf8; }
    .action-btn { background: #0284c7; color: white; border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .action-btn:hover:not(:disabled) { background: #0369a1; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .side-panel { background: #0f172a; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; height: 100%; }
    .panel-section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .panel-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 600; color: #f8fafc; }

    .reset-btn { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: 100%; transition: 0.2s; }
    .reset-btn:hover { background: #ef44441a; }

    .setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #090d16; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
    .setup-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.7); margin: auto; }
    .setup-card h2 { color: #38bdf8; font-size: 1.4rem; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; font-size: 0.95rem; font-family: inherit; }
    .form-group textarea { height: 80px; resize: none; }
    .error-msg { color: #ef4444; font-size: 0.85rem; display: none; }
    .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="setup-screen" id="setupScreen">
    <div class="setup-card">
      <h2>Simulation Carrière MMA & Sport de Combat</h2>
      
      <div class="form-group">
        <label>Clé API Gemini :</label>
        <input type="password" id="cfgApiKey" placeholder="Collez votre clé API...">
        <span class="error-msg" id="apiKeyError">Veuillez entrer une clé API valide.</span>
      </div>

      <div class="form-group">
        <label>Modèle Gemini :</label>
        <select id="cfgModel">
          <option value="gemini-1.5-flash" selected>gemini-1.5-flash (Standard)</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash</option>
        </select>
      </div>

      <div class="form-group">
        <label>Niveau de Difficulté :</label>
        <select id="cfgDiff">
          <option value="facile">Facile</option>
          <option value="normal" selected>Normal</option>
          <option value="difficile">Difficile (Pression maximale)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nom du Combattant :</label>
        <input type="text" id="cfgName" placeholder="Ex: Adam...">
      </div>

      <div class="form-group">
        <label>Votre Lore / Scénario de départ :</label>
        <textarea id="cfgLore" placeholder="Ex: Jeune prodige de MMA basé à Paris, encaisseur né, déterminé à signer dans une grande organisation..."></textarea>
      </div>

      <button class="action-btn" id="launchBtn" style="padding: 14px;" onclick="initSimulation()">Lancer la Carrière Sportive</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <h1>Simulation : Sport de Combat & MMA</h1>
      <div class="header-info" id="headerInfo">Tour 1</div>
    </header>

    <div class="game-layout">
      <div class="chat-section">
        <div class="log-panel" id="logPanel"></div>
        <div class="input-panel">
          <textarea id="userInput" placeholder="Décris ton action ou réponds au dilemme..." onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitAction(); }"></textarea>
          <button class="action-btn" id="submitBtn" onclick="submitAction()">Envoyer</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="panel-section">
          <div class="panel-title">Profil Combattant</div>
          <div class="stat-row"><span class="stat-label">Nom</span><span class="stat-val" id="uiName">-</span></div>
          <div class="stat-row"><span class="stat-label">Difficulté</span><span class="stat-val" id="uiDiff">-</span></div>
        </div>

        <div class="panel-section">
          <div class="panel-title">Statistiques & Jauges</div>
          <div id="statsContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <button class="reset-btn" onclick="resetToSetup()">Recommencer à zéro</button>
      </div>
    </div>
  </div>

  <script>
    let gameState = {
      apiKey: '',
      model: 'gemini-1.5-flash',
      difficulty: 'normal',
      name: '',
      lore: '',
      turn: 1,
      stats: { forme: 80, technique: 50, argent: 400, moral: 80 }
    };

    const statLabels = {
      forme: "Forme physique",
      technique: "Technique MMA",
      argent: "Argent (€)",
      moral: "Moral"
    };

    async function initSimulation() {
      let apiKey = document.getElementById('cfgApiKey').value.trim();
      if (!apiKey) {
        document.getElementById('apiKeyError').style.display = 'block';
        return;
      }

      let model = document.getElementById('cfgModel').value;
      let diff = document.getElementById('cfgDiff').value;
      let name = document.getElementById('cfgName').value.trim() || "Adam";
      let lore = document.getElementById('cfgLore').value.trim() || "Jeune combattant déterminé à percer dans le milieu du MMA.";

      gameState.apiKey = apiKey;
      gameState.model = model;
      gameState.difficulty = diff;
      gameState.name = name;
      gameState.lore = lore;
      gameState.turn = 1;
      gameState.stats = { forme: 80, technique: 50, argent: 400, moral: 80 };

      let launchBtn = document.getElementById('launchBtn');
      launchBtn.disabled = true;
      launchBtn.innerHTML = `<span class="loading-spinner"></span>Création de la carrière...`;

      let promptIntro = `Tu es le maître d'un jeu de rôle textuel immersif spécialisé dans la **carrière de combattant MMA / sports de combat**.
Le joueur s'appelle ${name}, difficulté ${diff}. 
Son lore/scénario personnel : "${lore}".
Stats initiales : ${JSON.stringify(gameState.stats)}.

Règles strictes :
1. Intègre à 100% le lore du joueur dès la première phrase.
2. Plonge-le directement dans une scène réaliste de sa vie de combattant.
3. **À la fin de ton texte, pose obligatoirement un dilemme clair ou un choix percutant**.
4. Réponds STRICTEMENT au format JSON pur (sans balises markdown autour ni texte parasite) avec cette structure exacte :
{
  "narrative": "Le texte d'introduction immersif...",
  "dilemme": "Le dilemme ou la question cruciale posée au joueur...",
  "statChanges": {}
}`;

      try {
        let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${gameState.model}:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptIntro }] }] })
        });

        let data = await response.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        let jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("Format JSON invalide reçu de l'IA.");
        let result = JSON.parse(jsonMatch[0]);

        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('uiName').innerText = name;
        document.getElementById('uiDiff').innerText = diff.toUpperCase();

        renderStats();

        let log = document.getElementById('logPanel');
        log.innerHTML = `
          <div class="msg system">Carrière lancée pour <b>${name}</b> (Spécialité : Sport de Combat / MMA)</div>
          <div class="msg ai">
            <b>Début de l'aventure</b><br><br>${result.narrative}
            <div class="dilemma-box">⚖️ <b>Dilemme / Situation :</b> ${result.dilemme}</div>
          </div>
        `;

      } catch (err) {
        alert("Erreur d'initialisation : " + err.message);
      }

      launchBtn.disabled = false;
      launchBtn.innerHTML = "Lancer la Carrière Sportive";
    }

    function renderStats() {
      let container = document.getElementById('statsContainer');
      container.innerHTML = '';
      for (let key in gameState.stats) {
        container.innerHTML += `
          <div class="stat-row">
            <span class="stat-label">${statLabels[key] || key}</span>
            <span class="stat-val" id="stat-${key}">${gameState.stats[key]}</span>
          </div>
        `;
      }
      document.getElementById('headerInfo').innerText = `Tour ${gameState.turn}`;
    }

    async function submitAction() {
      let textarea = document.getElementById('userInput');
      let actionText = textarea.value.trim();
      if (!actionText) return;

      textarea.value = '';
      let log = document.getElementById('logPanel');
      log.innerHTML += `<div class="msg user">${actionText}</div>`;
      log.scrollTop = log.scrollHeight;

      document.getElementById('submitBtn').disabled = true;
      textarea.disabled = true;

      let systemPrompt = `Tu es le moteur expert d'une simulation de carrière de combattant MMA. 
Le joueur s'appelle ${gameState.name}, difficulté: "${gameState.difficulty}", lore initial: "${gameState.lore}". 
Statistiques actuelles : ${JSON.stringify(gameState.stats)}.

Règles absolues :
1. Analyse l'action du joueur (${actionText}) en maintenant une parfaite continuité logique.
2. Fais progresser l'intrigue sportive.
3. **À la fin de chaque tour, pose impérativement un nouveau dilemme ou choix critique**.
4. Ajuste les statistiques de façon cohérente (valeurs entières simples, ex: -10, +5).
5. Réponds STRICTEMENT au format JSON pur avec cette structure exacte :
{
  "narrative": "Le texte narratif de la suite de l'histoire...",
  "dilemme": "Le prochain dilemme ou choix crucial...",
  "statChanges": {
    "forme": 0,
    "technique": 0,
    "argent": 0,
    "moral": 0
  }
}`;

      try {
        let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${gameState.model}:generateContent?key=${gameState.apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              { role: "user", parts: [{ text: systemPrompt }] },
              { role: "model", parts: [{ text: "Compris. Prêt pour le prochain tour du combattant." }] },
              { role: "user", parts: [{ text: `Action du joueur : ${actionText}` }] }
            ]
          })
        });

        let data = await response.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        let jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("Format JSON invalide : " + rawText);
        let result = JSON.parse(jsonMatch[0]);

        if (result.statChanges) {
          for (let s in result.statChanges) {
            if (gameState.stats[s] !== undefined) {
              gameState.stats[s] = Math.max(0, gameState.stats[s] + result.statChanges[s]);
            }
          }
        }

        gameState.turn++;
        renderStats();

        log.innerHTML += `
          <div class="msg ai">
            <b>Tour ${gameState.turn}</b><br><br>${result.narrative}
            ${result.dilemme ? `<div class="dilemma-box">⚖️ <b>Dilemme / Situation :</b> ${result.dilemme}</div>` : ''}
          </div>
        `;
        log.scrollTop = log.scrollHeight;

      } catch (err) {
        log.innerHTML += `<div class="msg system" style="color: #ef4444;">Erreur : ${err.message}</div>`;
      }

      document.getElementById('submitBtn').disabled = false;
      textarea.disabled = false;
      textarea.focus();
    }

    function resetToSetup() {
      document.getElementById('setupScreen').style.display = 'flex';
      document.getElementById('logPanel').innerHTML = '';
    }
  </script>
</body>
</html>
