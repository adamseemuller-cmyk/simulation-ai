<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; }
    #log { background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 8px; min-height: 200px; margin-bottom: 20px; white-space: pre-wrap; }
    .user { font-weight: bold; color: #2b6cb0; margin-top: 10px; }
    .ai { color: #2d3748; margin-bottom: 10px; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #319795; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #cbd5e0; }
  </style>
</head>
<body>

  <h1>Simulation IA</h1>
  <div id="log">Chargement...</div>

  <div class="input-area">
    <input type="text" id="actionInput" placeholder="Que veux-tu faire ?">
    <button id="sendBtn" onclick="playTurn()">Envoyer</button>
  </div>

  <script>
    const SUPABASE_URL = "https://wzqvjndyyljhquxsmxae.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXZqbmR5eWxqaHF1eHNteGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNTA2MjEsImV4cCI6MjA1NTkyNjYyMX0.9G_M3wF59z7O-q1xW2J2x5O2lY6f4K1c"; 
    const GEMINI_API_KEY = "AQ.Ab8RN6LQAfPLUYckLMS70XIGVmjLJYRcRTeeqyt3s7foctjBYg";
    const GAME_ID = "11111111-1111-1111-1111-111111111111";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let history = [];

    async function loadGame() {
      const { data } = await supabaseClient
        .from('games')
        .select('actions')
        .eq('id', GAME_ID)
        .single();

      if (data && data.actions) {
        history = data.actions;
      } else {
        history = [{ role: "system", text: "Bienvenue dans la simulation. Tu es dans un monde sauvage. Que fais-tu ?" }];
        await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
      }
      render();
    }

    function render() {
      const log = document.getElementById('log');
      log.innerHTML = history.map(h => {
        if (h.role === 'user') return `<div class="user">Toi : ${h.text}</div>`;
        if (h.role === 'model' || h.role === 'system') return `<div class="ai">${h.text}</div>`;
        return '';
      }).join('');
    }

    async function playTurn() {
      const input = document.getElementById('actionInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;

      history.push({ role: "user", text: text });
      render();

      try {
        const prompt = "Tu es le maître du jeu d'une simulation. Réponds brièvement à l'action du joueur en décrivant ce qui se passe ensuite.\n" + 
          history.map(h => `${h.role}: ${h.text}`).join('\n');

         const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const reply = data.candidates[0].content.parts[0].text;

        history.push({ role: "model", text: reply });
        await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
        render();
      } catch (err) {
        alert("Erreur IA : " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    loadGame();
  </script>
</body>
</html>
