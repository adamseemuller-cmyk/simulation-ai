<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation AI - Hardcore RPG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; background: #1a202c; color: #e2e8f0; }
    h1 { text-align: center; color: #e53e3e; margin-bottom: 5px; }
    #hero-title { text-align: center; color: #cbd5e0; font-style: italic; margin-bottom: 20px; }
    
    .game-container { display: flex; gap: 20px; margin-bottom: 20px; }
    #log { flex: 2; background: #2d3748; border: 1px solid #4a5568; padding: 15px; border-radius: 8px; min-height: 300px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
    
    #stats-panel { flex: 1; background: #2d3748; border: 1px solid #4a5568; padding: 15px; border-radius: 8px; height: fit-content; }
    .stat-box { margin-bottom: 12px; }
    .stat-title { font-weight: bold; color: #a0aec0; font-size: 0.85em; text-transform: uppercase; }
    .stat-value { font-size: 1.1em; font-weight: bold; color: #48bb78; }
    .hp-danger { color: #f56565 !important; }
    
    .user { font-weight: bold; color: #63b3ed; margin-top: 10px; border-top: 1px dashed #4a5568; padding-top: 5px; }
    .ai { color: #e2e8f0; margin-bottom: 10px; line-height: 1.5; }
    
    .options-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-btn { padding: 12px; background: #319795; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.95em; }
    .option-btn:hover { background: #2c7a7b; }
    
    .input-area { display: flex; gap: 10px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px; border: 1px solid #4a5568; background: #2d3748; color: white; border-radius: 6px; }
    button.start-btn { padding: 12px 20px; background: #e53e3e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .reset-btn { background: #718096; width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Simulation IA</h1>
  <div id="hero-title">Choisissez votre destin...</div>

  <div class="game-container">
    <div id="log">Chargement...</div>
    
    <div id="stats-panel">
      <h3>Fiche du Héros</h3>
      <div class="stat-box">
        <div class="stat-title">Points de Vie (PV)</div>
        <div class="stat-value" id="hpDisplay">100 / 100</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Arme Équipée</div>
        <div id="weaponDisplay" style="color:#63b3ed;">Mains nues</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Armure</div>
        <div id="armorDisplay" style="color:#63b3ed;">Vêtements simples</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Pièces d'or</div>
        <div class="stat-value" id="goldDisplay" style="color:#ecc94b;">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Inventaire</div>
        <div id="inventoryDisplay" style="font-size:0.85em; color:#e2e8f0;">Aucun objet</div>
      </div>
    </div>
  </div>

  <div class="input-area" id="startInputArea">
    <input type="text" id="actionInput" placeholder="Ex: Un pirate aux Caraïbes en 1714...">
    <button class="start-btn" id="sendBtn" onclick="submitCustomInput()">Lancer la partie</button>
  </div>

  <div class="options-area" id="optionsArea" style="display:none;"></div>

  <button class="reset-btn" onclick="resetGame()">Recommencer une partie</button>

  <script>
    const SUPABASE_URL = "https://wzqvjndyyljhquxsmxae.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXZqbmR5eWxqaHF1xHNteGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNTA2MjEsImV4cCI6MjA1NTkyNjYyMX0.9G_M3wF59z7O-q1xW2J2x5O2lY6f4K1c"; 
    const GEMINI_API_KEY = "AQ.Ab8RN6LQAfPLUYckLMS70XIGVmjLJYRcRTeeqyt3s7foctjBYg";
    const GAME_ID = "11111111-1111-1111-1111-111111111111";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let history = [];
    let playerStats = { heroName: "Inconnu", hp: 100, gold: 0, weapon: "Mains nues", armor: "Vêtements simples", inventory: [] };

    const SYSTEM_INSTRUCTION = `Tu es le Maître du Jeu d'un jeu de rôle HARDCORE et RÉALISTE.
Consignes :
1. Au tout 1er tour, donne un Nom/Titre stylé au personnage selon la saisie du joueur.
2. Sois exigeant : les mauvaises décisions font perdre beaucoup de PV.
3. Si le joueur a une bonne arme ou armure, réduis la perte de PV en cas de combat.
4. Tu dois TOUJOURS répondre en JSON strict sans balises markdown :
{
  "hero_name": "Nom du héros",
  "narrative": "Texte court de l'histoire (3-4 phrases)",
  "hp_change": 0,
  "gold_change": 0,
  "weapon": "Nom de l'arme (ou garder l'actuelle)",
  "armor": "Nom de l'armure (ou garder l'actuelle)",
  "item_add": null,
  "item_remove": null,
  "options": ["Choix A", "Choix B", "Choix C"]
}`;

    async function loadGame() {
      const { data } = await supabaseClient.from('games').select('actions').eq('id', GAME_ID).single();

      if (data && data.actions && data.actions.length > 0) {
        history = data.actions;
        document.getElementById('startInputArea').style.display = 'none';
        document.getElementById('optionsArea').style.display = 'flex';
        render();
      } else {
        history = [{ role: "system", text: "🎮 **Bienvenue dans la Simulation !**\n\nÉcris le contexte de ton aventure ci-dessous pour créer ton personnage." }];
        await saveHistory();
        render();
      }
    }

    async function saveHistory() {
      await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
    }

    function updateStatsDisplay() {
      document.getElementById('hero-title').innerText = playerStats.heroName !== "Inconnu" ? `Aventure de ${playerStats.heroName}` : "Choisissez votre destin...";
      const hpEl = document.getElementById('hpDisplay');
      hpEl.innerText = `${playerStats.hp} / 100`;
      if (playerStats.hp <= 30) hpEl.classList.add('hp-danger');
      else hpEl.classList.remove('hp-danger');

      document.getElementById('weaponDisplay').innerText = playerStats.weapon;
      document.getElementById('armorDisplay').innerText = playerStats.armor;
      document.getElementById('goldDisplay').innerText = playerStats.gold;
      document.getElementById('inventoryDisplay').innerText = playerStats.inventory.length > 0 ? playerStats.inventory.join(', ') : 'Aucun objet';
    }

    function render(lastOptions = []) {
      const log = document.getElementById('log');
      log.innerHTML = history.map(h => {
        if (h.role === 'user') return `<div class="user">Toi : ${h.text}</div>`;
        if (h.role === 'model' || h.role === 'system') return `<div class="ai">${h.text}</div>`;
        return '';
      }).join('');
      log.scrollTop = log.scrollHeight;

      updateStatsDisplay();

      const optionsArea = document.getElementById('optionsArea');
      optionsArea.innerHTML = '';
      if (lastOptions.length > 0 && playerStats.hp > 0) {
        lastOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => selectOption(opt);
          optionsArea.appendChild(btn);
        });
      } else if (playerStats.hp <= 0) {
        optionsArea.innerHTML = `<div style="color:#f56565; font-weight:bold; text-align:center; padding:10px; background:#2d3748; border-radius:6px;">☠️ MORT DU HÉROS — Votre aventure s'arrête ici. Cliquez ci-dessous pour recommencer.</div>`;
      }
    }

    async function submitCustomInput() {
      const input = document.getElementById('actionInput');
      const text = input.value.trim();
      if (!text) return;
      document.getElementById('startInputArea').style.display = 'none';
      document.getElementById('optionsArea').style.display = 'flex';
      await playTurn(text);
    }

    async function selectOption(optionText) {
      await playTurn(optionText);
    }

    async function playTurn(userChoice) {
      history.push({ role: "user", text: userChoice });
      render();
      await saveHistory();

      try {
        const prompt = SYSTEM_INSTRUCTION + "\n\nStats actuelles : " + JSON.stringify(playerStats) +
          "\n\nHistorique :\n" + history.map(h => `${h.role}: ${h.text}`).join('\n');

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text.trim();
        rawText = rawText.replace(/^```json/, '').replace(/```json/g, '').replace(/```/g, '').trim();

        const parsed = JSON.parse(rawText);

        if (parsed.hero_name) playerStats.heroName = parsed.hero_name;
        if (parsed.weapon) playerStats.weapon = parsed.weapon;
        if (parsed.armor) playerStats.armor = parsed.armor;
        
        playerStats.hp = Math.max(0, Math.min(100, playerStats.hp + (parsed.hp_change || 0)));
        playerStats.gold = Math.max(0, playerStats.gold + (parsed.gold_change || 0));
        
        if (parsed.item_add) playerStats.inventory.push(parsed.item_add);
        if (parsed.item_remove) {
          const idx = playerStats.inventory.indexOf(parsed.item_remove);
          if (idx !== -1) playerStats.inventory.splice(idx, 1);
        }

        history.push({ role: "model", text: parsed.narrative });
        await saveHistory();

        render(parsed.options || []);

      } catch (err) {
        alert("Erreur IA : " + err.message);
      }
    }

    async function resetGame() {
      if (confirm("Recommencer une partie ?")) {
        history = [];
        playerStats = { heroName: "Inconnu", hp: 100, gold: 0, weapon: "Mains nues", armor: "Vêtements simples", inventory: [] };
        await supabaseClient.from('games').delete().eq('id', GAME_ID);
        document.getElementById('startInputArea').style.display = 'flex';
        document.getElementById('optionsArea').style.display = 'none';
        loadGame();
      }
    }

    loadGame();
  </script>
</body>
</html>
