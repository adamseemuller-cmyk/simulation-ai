<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; }
    #log { background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 8px; min-height: 250px; margin-bottom: 20px; white-space: pre-wrap; }
    .user { font-weight: bold; color: #2b6cb0; margin-top: 10px; }
    .ai { color: #2d3748; margin-bottom: 10px; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #319795; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #cbd5e0; }
    .reset-btn { background: #e53e3e; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Simulation IA</h1>
  <div id="log">Chargement...</div>

  <div class="input-area">
    <input type="text" id="actionInput" placeholder="Tape ton choix ici...">
    <button id="sendBtn" onclick="playTurn()">Envoyer</button>
  </div>
  
  <button class="reset-btn" onclick="resetGame()">Réinitialiser / Nouvelle partie</button>

  <script>
    const SUPABASE_URL = "https://wzqvjndyyljhquxsmxae.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXZqbmR5eWxqaHF1eHNteGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNTA2MjEsImV4cCI6MjA1NTkyNjYyMX0.9G_M3wF59z7O-q1xW2J2x5O2lY6f4K1c"; 
    const GEMINI_API_KEY = "AQ.Ab8RN6LQAfPLUYckLMS70XIGVmjLJYRcRTeeqyt3s7foctjBYg";
    const GAME_ID = "11111111-1111-1111-1111-111111111111";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let history = [];

    const SYSTEM_INSTRUCTION = `Tu es le Maître du Jeu d'une simulation interactive. 
    Au début, l'utilisateur va choisir soit un Personnage, soit un Pays/Continent.
    Utilise son choix pour générer un thème captivant, poser le décor, créer les enjeux et lancer l'aventure.
    Ensuite, réponds à chacune de ses actions de façon immersive et concise.`;

    async function loadGame() {
      const { data } = await supabaseClient
        .from('games')
        .select('actions')
        .eq('id', GAME_ID)
        .single();

      if (data && data.actions && data.actions.length > 0) {
        history = data.actions;
      } else {
        history = [{ 
          role: "system", 
          text: "🎮 Bienvenue dans la Simulation !\n\nPour commencer, choisis ton mode d'aventure :\n👉 Option 1 : Choisis un Personnage (ex: Un pirate, un détective, un roi...)\n👉 Option 2 : Choisis un Pays ou un Continent (ex: Le Japon, l'Europe médiévale, une île dans le Pacifique...)\n\nQue choisis-tu ?" 
        }];
        await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
      }
      render();
    }

    function render() {
      const log = document.getElementById('log');
      log.innerHTML = history.map(h => {
        if (h.role === 'user') return `<div class="user">Toi : ${h.text}</div>`;
        if (h.role === 'model' || h.role === 'system') return `<div class="ai">${h.text}</div>`;
        return '';
      }).join('');
    }

    async function playTurn() {
      const input = document.getElementById('actionInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;

      history.push({ role: "user", text: text });
      render();

      try {
        const prompt = SYSTEM_INSTRUCTION + "\n\nHistorique de la partie :\n" + 
          history.map(h => `${h.role}: ${h.text}`).join('\n');

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        history.push({ role: "model", text: reply });
        await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
        render();
      } catch (err) {
        alert("Erreur IA : " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function resetGame() {
      if (confirm("Veux-tu vraiment recommencer une nouvelle partie ?")) {
        history = [];
        await supabaseClient.from('games').delete().eq('id', GAME_ID);
        loadGame();
      }
    }

    loadGame();
  </script>
</body>
</html>
