<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; }
    #log { background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 8px; min-height: 250px; margin-bottom: 20px; white-space: pre-wrap; }
    .user { font-weight: bold; color: #2b6cb0; margin-top: 10px; }
    .ai { color: #2d3748; margin-bottom: 10px; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #319795; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #cbd5e0; }
    .reset-btn { background: #e53e3e; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>Simulation IA</h1>
  <div id="log">Chargement de la partie...</div>

  <div class="input-area">
    <input type="text" id="actionInput" placeholder="Écris ton choix ou ton action ici...">
    <button id="sendBtn" onclick="playTurn()">Envoyer</button>
  </div>
  
  <button class="reset-btn" onclick="resetGame()">Recommencer une partie</button>

  <script>
    const SUPABASE_URL = "https://wzqvjndyyljhquxsmxae.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXZqbmR5eWxqaHF1eHNteGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNTA2MjEsImV4cCI6MjA1NTkyNjYyMX0.9G_M3wF59z7O-q1xW2J2x5O2lY6f4K1c"; 
    const GEMINI_API_KEY = "AQ.Ab8RN6LQAfPLUYckLMS70XIGVmjLJYRcRTeeqyt3s7foctjBYg";
    const GAME_ID = "11111111-1111-1111-1111-111111111111";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let history = [];

    const SYSTEM_INSTRUCTION = `Tu es le Maître du Jeu d'une simulation interactive en texte.
RÈGLES IMPORTANTES :
1. Au premier tour, le joueur te décrit son personnage OU son cadre de jeu (pays, ville, époque, détails historiques ou fantastiques).
2. Utilise TOUS les détails fournis par le joueur (ex: "Japon en 1945", "Pirate de la mer des Caraïbes en 1715") pour installer le décor et l'ambiance exacte.
3. Fais des réponses courtes (3 à 5 phrases max) pour garder un rythme de jeu très rapide.
4. Termine toujours par une question directe ou une situation qui demande un choix au joueur.`;

    async function loadGame() {
      const { data, error } = await supabaseClient
        .from('games')
        .select('actions')
        .eq('id', GAME_ID)
        .single();

      if (data && data.actions && data.actions.length > 0) {
        history = data.actions;
      } else {
        history = [{ 
          role: "system", 
          text: "🎮 **Bienvenue dans la Simulation !**\n\nPour lancer l'aventure, choisis ton thème en donnant autant de détails que tu veux :\n\n👉 **Option 1 : Un Personnage** (ex: *Un détective privé à New York en 1930*, *Un mage noir banni*...)\n👉 **Option 2 : Un Lieu / Une Époque** (ex: *Le Japon en 1945*, *La France du Moyen Âge*, *Une station spatiale en 2150*...)\n\nQue décides-tu d'incarner ou d'explorer ?" 
        }];
        await saveHistory();
      }
      render();
    }

    async function saveHistory() {
      await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
    }

    function render() {
      const log = document.getElementById('log');
      log.innerHTML = history.map(h => {
        if (h.role === 'user') return `<div class="user">Toi : ${h.text}</div>`;
        if (h.role === 'model' || h.role === 'system') return `<div class="ai">${h.text}</div>`;
        return '';
      }).join('');
      log.scrollTop = log.scrollHeight;
    }

    async function playTurn() {
      const input = document.getElementById('actionInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;

      history.push({ role: "user", text: text });
      render();
      await saveHistory();

      try {
        const prompt = SYSTEM_INSTRUCTION + "\n\nHistorique :\n" + 
          history.map(h => `${h.role}: ${h.text}`).join('\n');

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        history.push({ role: "model", text: reply });
        
        await saveHistory();
        render();
      } catch (err) {
        alert("Erreur IA : " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function resetGame() {
      if (confirm("Veux-tu réinitialiser et recommencer une nouvelle aventure ?")) {
        history = [];
        await supabaseClient.from('games').delete().eq('id', GAME_ID);
        loadGame();
      }
    }

    loadGame();
  </script>
</body>
</html>
