<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation AI - Hardcore RPG Visuel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 850px; margin: 20px auto; padding: 0 20px; background: #1a202c; color: #e2e8f0; }
    h1 { text-align: center; color: #e53e3e; }
    
    /* Layout principal */
    .game-container { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    
    /* Zone de l'histoire et image */
    .main-section { flex: 2; min-width: 300px; }
    #scene-image { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; border: 1px solid #4a5568; margin-bottom: 15px; background: #2d3748; display: none; }
    #log { background: #2d3748; border: 1px solid #4a5568; padding: 15px; border-radius: 8px; min-height: 250px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
    
    /* Fiche de personnage */
    #stats-panel { flex: 1; min-width: 220px; background: #2d3748; border: 1px solid #4a5568; padding: 15px; border-radius: 8px; height: fit-content; }
    .stat-box { margin-bottom: 15px; }
    .stat-title { font-weight: bold; color: #cbd5e0; font-size: 0.9em; text-transform: uppercase; }
    .stat-value { font-size: 1.2em; font-weight: bold; color: #48bb78; }
    .hp-danger { color: #f56565 !important; }
    
    /* Messages */
    .user { font-weight: bold; color: #63b3ed; margin-top: 10px; border-top: 1px dashed #4a5568; padding-top: 5px; }
    .ai { color: #e2e8f0; margin-bottom: 10px; line-height: 1.5; }
    
    /* Zone de choix */
    .options-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-btn { padding: 12px; background: #319795; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.95em; transition: 0.2s; }
    .option-btn:hover { background: #2c7a7b; }
    .option-btn:disabled { background: #4a5568; cursor: not-allowed; }
    
    /* Saisie initiale */
    .input-area { display: flex; gap: 10px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px; border: 1px solid #4a5568; background: #2d3748; color: white; border-radius: 6px; }
    button.start-btn { padding: 12px 20px; background: #e53e3e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .reset-btn { background: #718096; width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Simulation IA — Mode Hardcore Visuel</h1>

  <div class="game-container">
    <div class="main-section">
      <!-- Image générée automatiquement par l'IA -->
      <img id="scene-image" alt="Illustration de la scène" src="">
      <div id="log">Chargement...</div>
    </div>
    
    <div id="stats-panel">
      <h3>Fiche de Joueur</h3>
      <div class="stat-box">
        <div class="stat-title">Points de Vie (PV)</div>
        <div class="stat-value" id="hpDisplay">100 / 100</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Pièces d'or</div>
        <div class="stat-value" id="goldDisplay" style="color:#ecc94b;">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Inventaire</div>
        <div id="inventoryDisplay" style="font-size:0.9em; color:#e2e8f0;">Aucun objet</div>
      </div>
    </div>
  </div>

  <!-- Zone d'entrée au départ -->
  <div class="input-area" id="startInputArea">
    <input type="text" id="actionInput" placeholder="Ex: Un pirate aux Caraïbes en 1715, ou Le Japon en 1945...">
    <button class="start-btn" id="sendBtn" onclick="submitCustomInput()">Lancer la partie</button>
  </div>

  <!-- Boutons d'options A / B / C -->
  <div class="options-area" id="optionsArea" style="display:none;"></div>

  <button class="reset-btn" onclick="resetGame()">Recommencer une partie</button>

  <script>
    const SUPABASE_URL = "https://wzqvjndyyljhquxsmxae.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXZqbmR5eWxqaHF1xHNteGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNTA2MjEsImV4cCI6MjA1NTkyNjYyMX0.9G_M3wF59z7O-q1xW2J2x5O2lY6f4K1c"; 
    const GEMINI_API_KEY = "AQ.Ab8RN6LQAfPLUYckLMS70XIGVmjLJYRcRTeeqyt3s7foctjBYg";
    const GAME_ID = "11111111-1111-1111-1111-111111111111";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let history = [];
    let playerStats = { hp: 100, gold: 0, inventory: [] };

    const SYSTEM_INSTRUCTION = `Tu es le Maître du Jeu d'un jeu de rôle texte HARDCORE et RÉALISTE.
Consignes d'écriture :
1. Sois exigeant et réaliste : pas de magie improvisée sans conséquences lourdes.
2. À CHAQUE TOUR, tu dois impérativement renvoyer la réponse au format JSON strict avec les clés :
   - "narrative": La suite de l'histoire (3-4 phrases).
   - "image_prompt": Une description en ANGLAIS courte et visuelle de la scène pour générer une image (ex: "A dark feudal Japanese village at night, cinematic lighting, realistic").
   - "hp_change": Variation de PV (ex: 0, -15, +5).
   - "gold_change": Variation d'or (ex: 0, +10, -5).
   - "item_add": Nom d'un objet gagné (ou null).
   - "item_remove": Nom d'un objet perdu (ou null).
   - "options": Un tableau de 3 choix cliquables ["Option A", "Option B", "Option C"].`;

    async function loadGame() {
      const { data } = await supabaseClient
        .from('games')
        .select('actions')
        .eq('id', GAME_ID)
        .single();

      if (data && data.actions && data.actions.length > 0) {
        history = data.actions;
        document.getElementById('startInputArea').style.display = 'none';
        document.getElementById('optionsArea').style.display = 'flex';
        render();
      } else {
        history = [{ 
          role: "system", 
          text: "🎮 **Bienvenue dans la Simulation Visuelle !**\n\nDécris ton personnage ou le lieu/l'époque où tu souhaites démarrer pour lancer l'aventure." 
        }];
        await saveHistory();
        render();
      }
    }

    async function saveHistory() {
      await supabaseClient.from('games').upsert({ id: GAME_ID, actions: history });
    }

    function updateStatsDisplay() {
      const hpEl = document.getElementById('hpDisplay');
      hpEl.innerText = `${playerStats.hp} / 100`;
      if (playerStats.hp <= 30) hpEl.classList.add('hp-danger');
      else hpEl.classList.remove('hp-danger');

      document.getElementById('goldDisplay').innerText = playerStats.gold;
      document.getElementById('inventoryDisplay').innerText = playerStats.inventory.length > 0 
        ? playerStats.inventory.join(', ') 
        : 'Aucun objet';
    }

    function render(lastOptions = []) {
      const log = document.getElementById('log');
      log.innerHTML = history.map(h => {
        if (h.role === 'user') return `<div class="user">Toi : ${h.text}</div>`;
        if (h.role === 'model' || h.role === 'system') return `<div class="ai">${h.text}</div>`;
        return '';
      }).join('');
      log.scrollTop = log.scrollHeight;

      updateStatsDisplay();

      const optionsArea = document.getElementById('optionsArea');
      optionsArea.innerHTML = '';
      if (lastOptions.length > 0 && playerStats.hp > 0) {
        lastOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => selectOption(opt);
          optionsArea.appendChild(btn);
        });
      } else if (playerStats.hp <= 0) {
        optionsArea.innerHTML = `<div style="color:#f56565; font-weight:bold; text-align:center;">💀 VOUS ÊTES MORT. Cliquez sur Recommencer.</div>`;
      }
    }

    async function submitCustomInput() {
      const input = document.getElementById('actionInput');
      const text = input.value.trim();
      if (!text) return;

      document.getElementById('startInputArea').style.display = 'none';
      document.getElementById('optionsArea').style.display = 'flex';

      await playTurn(text);
    }

    async function selectOption(optionText) {
      await playTurn(optionText);
    }

    async function playTurn(userChoice) {
      history.push({ role: "user", text: userChoice });
      render();
      await saveHistory();

      try {
        const prompt = SYSTEM_INSTRUCTION + "\n\nStats actuelles du joueur : " + JSON.stringify(playerStats) +
          "\n\nHistorique :\n" + history.map(h => `${h.role}: ${h.text}`).join('\n') +
          "\n\nRéponds EXCLUSIVEMENT sous forme d'un objet JSON valide sans balises Markdown.";

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text.trim();
        rawText = rawText.replace(/^```json/, '').replace(/```$/, '').trim();

        const parsed = JSON.parse(rawText);

        // Mettre à jour l'image d'ambiance
        if (parsed.image_prompt) {
          const imgEl = document.getElementById('scene-image');
          const encodedPrompt = encodeURIComponent(parsed.image_prompt);
          imgEl.src = `https://pollinations.ai/p/${encodedPrompt}?width=800&height=350&seed=${Math.floor(Math.random() * 1000)}`;
          imgEl.style.display = 'block';
        }

        // Mise à jour des stats
        playerStats.hp = Math.max(0, Math.min(100, playerStats.hp + (parsed.hp_change || 0)));
        playerStats.gold = Math.max(0, playerStats.gold + (parsed.gold_change || 0));
        
        if (parsed.item_add) playerStats.inventory.push(parsed.item_add);
        if (parsed.item_remove) {
          const idx = playerStats.inventory.indexOf(parsed.item_remove);
          if (idx !== -1) playerStats.inventory.splice(idx, 1);
        }

        history.push({ role: "model", text: parsed.narrative });
        await saveHistory();

        render(parsed.options || []);

      } catch (err) {
        alert("Erreur de réponse IA : " + err.message);
      }
    }

    async function resetGame() {
      if (confirm("Recommencer une partie à zéro ?")) {
        history = [];
        playerStats = { hp: 100, gold: 0, inventory: [] };
        await supabaseClient.from('games').delete().eq('id', GAME_ID);
        document.getElementById('startInputArea').style.display = 'flex';
        document.getElementById('optionsArea').style.display = 'none';
        document.getElementById('scene-image').style.display = 'none';
        loadGame();
      }
    }

    loadGame();
  </script>
</body>
</html>
