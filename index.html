<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation AI</title>
  
  <!-- CDN Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      color: #202123;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      height: 60px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-weight: bold;
      background: white;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      max-width: 600px;
    }
    .user-msg {
      align-self: flex-end;
      background: #e3f2fd;
      border-color: #bbdefb;
    }
    #input-container {
      padding: 20px;
      background: white;
      border-top: 1px solid #e5e5e5;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      height: 50px;
    }
    button {
      padding: 0 20px;
      background: #10a37f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #1a7f64; }
  </style>
</head>
<body>

  <header>🌐 Simulation AI</header>

  <div id="chat-container">
    <div class="message">
      <p>Le monde évolue indépendamment de toi.</p>
      <p>Tu peux écrire librement ce que tu veux faire.</p>
      <p><strong>Que veux-tu commencer par faire ?</strong></p>
    </div>
  </div>

  <div id="input-container">
    <textarea id="decision-input" placeholder="Écris ta décision..."></textarea>
    <button onclick="envoyerDecision()">Envoyer</button>
  </div>

  <script>
    const SUPABASE_URL = "https://itowpzagxdnlgpuvjwcz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3amJfTkMnMt5ymkJyNoCBQ_e7qEaN79";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const GAME_ID = 1; 

    window.addEventListener('DOMContentLoaded', async () => {
      await chargerPartie();
    });

    async function envoyerDecision() {
      const input = document.getElementById('decision-input');
      const texte = input.value.trim();
      if (!texte) return;

      let { data: game } = await supabaseClient
        .from('games')
        .select('actions')
        .eq('id', GAME_ID)
        .maybeSingle();

      let actionsActuelles = (game && game.actions) ? game.actions : [];
      actionsActuelles.push(texte);

      const { error } = await supabaseClient
        .from('games')
        .upsert({ id: GAME_ID, actions: actionsActuelles });

      if (error) {
        alert("Erreur Supabase : " + error.message);
        console.error(error);
      } else {
        input.value = '';
        await chargerPartie();
      }
    }

    async function chargerPartie() {
      const container = document.getElementById('chat-container');
      
      let { data: game, error } = await supabaseClient
        .from('games')
        .select('actions')
        .eq('id', GAME_ID)
        .maybeSingle();

      if (error || !game || !game.actions) return;

      container.innerHTML = `
        <div class="message">
          <p>Le monde évolue indépendamment de toi.</p>
          <p>Tu peux écrire librement ce que tu veux faire.</p>
          <p><strong>Que veux-tu commencer par faire ?</strong></p>
        </div>
      `;

      game.actions.forEach(action => {
        const div = document.createElement('div');
        div.className = 'message user-msg';
        div.innerHTML = `<strong>Toi :</strong> ${action}`;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
